[package]
name = "chatq-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chatq-types = {path = "../chatq-types", features = ["proto"]}
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.14"
anyhow = "1"
tonic = "0.11.0"
prost = "0.12.6"
prost-types = "0.12.6"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
chrono = "0.4"
dotenv = "0.15.0"
sqlx = { version = "0.7.4", features = [ "runtime-tokio-rustls", "macros", "postgres", "chrono", "uuid" ] }
thiserror = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }
ttl_cache = "0.5.1"
dashmap = "5.5.3"
num = "0.4.3"

[build-dependencies]
tonic-build = "0.11.0"

[lib]
name = "lib"
path = "src/lib.rs"
