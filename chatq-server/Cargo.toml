[package]
name = "chatq-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chatq-types = {path = "../chatq-types"}
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.14"
anyhow = "1"
tonic = "0.6"
prost = "0.9"
prost-types = "0.9"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.7"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
chrono = "0.4"
dotenv = "0.15.0"
sqlx = { version = "0.7.4", features = [ "runtime-tokio-rustls", "macros", "postgres", "chrono", "uuid" ] }
thiserror = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

[build-dependencies]
tonic-build = "0.6"

[lib]
name = "lib"
path = "src/lib.rs"
